<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Relay IndexedDB Store POC Benchmark</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 24px;
      }
      label {
        display: block;
        margin: 8px 0;
      }
      button {
        margin-top: 12px;
      }
      pre {
        background: #f5f5f5;
        padding: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Relay IndexedDB Store POC Benchmark</h1>
    <p>
      Compares in-memory only vs IDB + full materialization vs IDB direct with
      bounded hot cache vs IDB via worker postMessage with bounded hot cache vs
      high-message-volume worker postMessage.
    </p>
    <label>
      Record count:
      <input id="recordCount" type="number" value="20000" min="1000" step="1000" />
    </label>
    <label>
      Read sample count:
      <input id="readSampleCount" type="number" value="4000" min="500" step="500" />
    </label>
    <label>
      Hot cache size (IDB direct):
      <input id="hotCacheSize" type="number" value="1000" min="100" step="100" />
    </label>
    <label>
      Worker read chunk size (lower = more postMessage traffic):
      <input id="workerReadChunkSize" type="number" value="100" min="1" step="1" />
    </label>
    <label>
      Relay payload user count:
      <input id="relayPayloadUserCount" type="number" value="2000" min="100" step="100" />
    </label>
    <label>
      Relay payload friends per user:
      <input id="relayFriendsPerUser" type="number" value="3" min="1" step="1" />
    </label>
    <button id="run">Run benchmark</button>
    <pre id="output"></pre>
    <script>
      const DB_NAME = 'relay-indexeddb-store-poc-benchmark';
      const WORKER_DB_NAME = 'relay-indexeddb-store-poc-benchmark-worker';
      const STORE_NAME = 'records';

      function log(line) {
        const output = document.getElementById('output');
        output.textContent += `${line}\n`;
      }

      function now() {
        return performance.now();
      }

      function heapBytes() {
        if (performance && performance.memory) {
          return performance.memory.usedJSHeapSize;
        }
        return null;
      }

      function heapDelta(startHeap, endHeap) {
        if (startHeap === null || endHeap === null) {
          return null;
        }
        return endHeap - startHeap;
      }

      function combinedHeapDelta(mainDelta, workerDelta) {
        const main = mainDelta === null ? 0 : mainDelta;
        const worker = workerDelta === null ? 0 : workerDelta;
        if (mainDelta === null && workerDelta === null) {
          return null;
        }
        return main + worker;
      }

      async function userAgentMemoryBytes() {
        if (
          typeof performance !== 'undefined' &&
          typeof performance.measureUserAgentSpecificMemory === 'function'
        ) {
          try {
            const result = await performance.measureUserAgentSpecificMemory();
            return result.bytes;
          } catch (_error) {
            return null;
          }
        }
        return null;
      }

      function makeRecord(id) {
        return {
          __id: id,
          __typename: 'User',
          id,
          name: `User ${id}`,
          bio: 'x'.repeat(128),
          score: id.length,
        };
      }

      function makeRecordID(index) {
        return `user:${index}`;
      }

      function openDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, 1);
          request.onupgradeneeded = event => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, {keyPath: '__id'});
            }
          };
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
        });
      }

      function clearDB(db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction([STORE_NAME], 'readwrite');
          tx.objectStore(STORE_NAME).clear();
          tx.onerror = () => reject(tx.error);
          tx.oncomplete = () => resolve();
        });
      }

      function bulkWrite(db, records) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction([STORE_NAME], 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          for (let i = 0; i < records.length; i++) {
            store.put(records[i]);
          }
          tx.onerror = () => reject(tx.error);
          tx.oncomplete = () => resolve();
        });
      }

      function bulkReadByIDs(db, ids) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction([STORE_NAME], 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const results = new Array(ids.length);
          let remaining = ids.length;
          for (let i = 0; i < ids.length; i++) {
            const request = store.get(ids[i]);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
              results[i] = request.result || null;
              remaining--;
              if (remaining === 0) {
                resolve(results);
              }
            };
          }
        });
      }

      function readAll(db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction([STORE_NAME], 'readonly');
          const request = tx.objectStore(STORE_NAME).getAll();
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
        });
      }

      function readByID(db, id) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction([STORE_NAME], 'readonly');
          const request = tx.objectStore(STORE_NAME).get(id);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result || null);
        });
      }

      function makeRelayLikePayload(userCount, friendsPerUser) {
        const users = new Array(userCount);
        for (let i = 0; i < userCount; i++) {
          const userID = makeRecordID(i);
          const friends = new Array(friendsPerUser);
          for (let j = 0; j < friendsPerUser; j++) {
            const friendIndex = (i * friendsPerUser + j + 1) % userCount;
            const friendID = `friend:${i}:${j}:${friendIndex}`;
            friends[j] = {
              __id: friendID,
              __typename: 'User',
              id: friendID,
              name: `Friend ${friendID}`,
              score: friendIndex,
            };
          }
          users[i] = {
            __id: userID,
            __typename: 'User',
            id: userID,
            name: `User ${i}`,
            score: i,
            friends,
          };
        }
        return {
          __id: 'root',
          __typename: 'Query',
          users,
        };
      }

      function normalizeRelayLikePayload(payload) {
        const records = {};
        const rootID = payload.__id;
        const userIDs = [];
        records[rootID] = {
          __id: rootID,
          __typename: payload.__typename,
          userIDs,
        };
        const users = payload.users;
        for (let i = 0; i < users.length; i++) {
          const user = users[i];
          userIDs.push(user.__id);
          const friendIDs = [];
          records[user.__id] = {
            __id: user.__id,
            __typename: user.__typename,
            id: user.id,
            name: user.name,
            score: user.score,
            friendIDs,
          };
          for (let j = 0; j < user.friends.length; j++) {
            const friend = user.friends[j];
            friendIDs.push(friend.__id);
            records[friend.__id] = {
              __id: friend.__id,
              __typename: friend.__typename,
              id: friend.id,
              name: friend.name,
              score: friend.score,
              friendIDs: [],
            };
          }
        }
        return {rootID, records};
      }

      async function denormalizeRelayLikePayload(getRecord, rootID) {
        const rootRecord = await getRecord(rootID);
        if (rootRecord == null) {
          return null;
        }
        const userIDs = rootRecord.userIDs || [];
        const users = new Array(userIDs.length);
        for (let i = 0; i < userIDs.length; i++) {
          const userRecord = await getRecord(userIDs[i]);
          if (userRecord == null) {
            users[i] = null;
            continue;
          }
          const friendIDs = userRecord.friendIDs || [];
          const friends = new Array(friendIDs.length);
          for (let j = 0; j < friendIDs.length; j++) {
            const friendRecord = await getRecord(friendIDs[j]);
            friends[j] =
              friendRecord == null
                ? null
                : {
                    __id: friendRecord.__id,
                    __typename: friendRecord.__typename,
                    id: friendRecord.id,
                    name: friendRecord.name,
                    score: friendRecord.score,
                    friends: [],
                  };
          }
          users[i] = {
            __id: userRecord.__id,
            __typename: userRecord.__typename,
            id: userRecord.id,
            name: userRecord.name,
            score: userRecord.score,
            friends,
          };
        }
        return {
          __id: rootRecord.__id,
          __typename: rootRecord.__typename,
          users,
        };
      }

      function createWorkerClient() {
        const workerSource = `
          const DB_NAME = ${JSON.stringify(WORKER_DB_NAME)};
          const STORE_NAME = ${JSON.stringify(STORE_NAME)};
          let dbPromise = null;
          function openDB() {
            if (dbPromise === null) {
              dbPromise = new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = event => {
                  const db = event.target.result;
                  if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, {keyPath: '__id'});
                  }
                };
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
              });
            }
            return dbPromise;
          }
          async function clearDB() {
            const db = await openDB();
            await new Promise((resolve, reject) => {
              const tx = db.transaction([STORE_NAME], 'readwrite');
              tx.objectStore(STORE_NAME).clear();
              tx.onerror = () => reject(tx.error);
              tx.oncomplete = () => resolve();
            });
          }
          async function bulkWrite(records) {
            const db = await openDB();
            await new Promise((resolve, reject) => {
              const tx = db.transaction([STORE_NAME], 'readwrite');
              const store = tx.objectStore(STORE_NAME);
              for (let i = 0; i < records.length; i++) {
                store.put(records[i]);
              }
              tx.onerror = () => reject(tx.error);
              tx.oncomplete = () => resolve();
            });
          }
          async function bulkReadByIDs(ids) {
            const db = await openDB();
            return await new Promise((resolve, reject) => {
              const tx = db.transaction([STORE_NAME], 'readonly');
              const store = tx.objectStore(STORE_NAME);
              const results = new Array(ids.length);
              let remaining = ids.length;
              for (let i = 0; i < ids.length; i++) {
                const request = store.get(ids[i]);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                  results[i] = request.result || null;
                  remaining--;
                  if (remaining === 0) {
                    resolve(results);
                  }
                };
              }
            });
          }
          function getHeapBytes() {
            if (typeof performance !== 'undefined' && performance.memory) {
              return performance.memory.usedJSHeapSize;
            }
            return null;
          }
          self.onmessage = async event => {
            const {id, command, payload} = event.data;
            try {
              let result = null;
              if (command === 'clear') {
                await clearDB();
              } else if (command === 'bulkWrite') {
                await bulkWrite(payload.records);
              } else if (command === 'bulkReadByIDs') {
                result = await bulkReadByIDs(payload.ids);
              } else if (command === 'getHeapBytes') {
                result = getHeapBytes();
              } else {
                throw new Error('Unknown command: ' + command);
              }
              self.postMessage({id, ok: true, result});
            } catch (error) {
              self.postMessage({id, ok: false, error: String(error)});
            }
          };
        `;
        const blob = new Blob([workerSource], {type: 'application/javascript'});
        const worker = new Worker(URL.createObjectURL(blob));
        let nextID = 0;
        const pending = new Map();
        worker.onmessage = event => {
          const {id, ok, result, error} = event.data;
          const handlers = pending.get(id);
          if (handlers === undefined) {
            return;
          }
          pending.delete(id);
          if (ok) {
            handlers.resolve(result);
          } else {
            handlers.reject(new Error(error));
          }
        };
        function send(command, payload) {
          return new Promise((resolve, reject) => {
            const id = ++nextID;
            pending.set(id, {resolve, reject});
            worker.postMessage({id, command, payload});
          });
        }
        return {
          clear: () => send('clear', {}),
          bulkWrite: records => send('bulkWrite', {records}),
          bulkReadByIDs: ids => send('bulkReadByIDs', {ids}),
          getHeapBytes: () => send('getHeapBytes', {}),
          dispose: () => worker.terminate(),
        };
      }

      class HotCache {
        constructor(maxSize) {
          this.maxSize = maxSize;
          this.map = new Map();
        }
        get(id) {
          const value = this.map.get(id);
          if (value === undefined) {
            return undefined;
          }
          this.map.delete(id);
          this.map.set(id, value);
          return value;
        }
        set(id, value) {
          if (this.map.has(id)) {
            this.map.delete(id);
          }
          this.map.set(id, value);
          if (this.map.size > this.maxSize) {
            const oldest = this.map.keys().next().value;
            this.map.delete(oldest);
          }
        }
        size() {
          return this.map.size;
        }
      }

      async function benchmarkInMemory(records, readIDs) {
        const startHeap = heapBytes();
        const writeStart = now();
        const map = new Map();
        for (let i = 0; i < records.length; i++) {
          map.set(records[i].__id, records[i]);
        }
        const writeMs = now() - writeStart;

        const coldStart = now();
        for (let i = 0; i < readIDs.length; i++) {
          map.get(readIDs[i]);
        }
        const coldMs = now() - coldStart;

        const warmStart = now();
        for (let i = 0; i < readIDs.length; i++) {
          map.get(readIDs[i]);
        }
        const warmMs = now() - warmStart;
        const endHeap = heapBytes();

        return {
          name: 'in-memory-only',
          writeMs,
          coldMs,
          warmMs,
          heapDeltaBytes: heapDelta(startHeap, endHeap),
          memoryProxy: `mapSize=${map.size}`,
        };
      }

      async function benchmarkIDBWithMaterializedMemory(db, records, readIDs) {
        const startHeap = heapBytes();

        const writeStart = now();
        await bulkWrite(db, records);
        const writeMs = now() - writeStart;

        const materializeStart = now();
        const all = await readAll(db);
        const map = new Map();
        for (let i = 0; i < all.length; i++) {
          map.set(all[i].__id, all[i]);
        }
        const materializeMs = now() - materializeStart;

        const coldStart = now();
        for (let i = 0; i < readIDs.length; i++) {
          map.get(readIDs[i]);
        }
        const coldMs = now() - coldStart;

        const warmStart = now();
        for (let i = 0; i < readIDs.length; i++) {
          map.get(readIDs[i]);
        }
        const warmMs = now() - warmStart;
        const endHeap = heapBytes();

        return {
          name: 'idb-plus-materialized-memory',
          writeMs,
          materializeMs,
          coldMs,
          warmMs,
          heapDeltaBytes: heapDelta(startHeap, endHeap),
          memoryProxy: `materializedMapSize=${map.size}`,
        };
      }

      async function benchmarkIDBDirectWithHotCache(
        db,
        records,
        readIDs,
        hotCacheSize,
      ) {
        const startHeap = heapBytes();
        const cache = new HotCache(hotCacheSize);

        const writeStart = now();
        await bulkWrite(db, records);
        const writeMs = now() - writeStart;

        const coldStart = now();
        const coldValues = await bulkReadByIDs(db, readIDs);
        for (let i = 0; i < readIDs.length; i++) {
          if (coldValues[i] != null) {
            cache.set(readIDs[i], coldValues[i]);
          }
        }
        const coldMs = now() - coldStart;

        const warmStart = now();
        let misses = 0;
        const missIDs = [];
        for (let i = 0; i < readIDs.length; i++) {
          const hit = cache.get(readIDs[i]);
          if (hit === undefined) {
            misses++;
            missIDs.push(readIDs[i]);
          }
        }
        if (missIDs.length > 0) {
          const missValues = await bulkReadByIDs(db, missIDs);
          for (let i = 0; i < missIDs.length; i++) {
            if (missValues[i] != null) {
              cache.set(missIDs[i], missValues[i]);
            }
          }
        }
        const warmMs = now() - warmStart;
        const endHeap = heapBytes();

        return {
          name: 'idb-direct-bounded-hot-cache',
          writeMs,
          coldMs,
          warmMs,
          warmMisses: misses,
          heapDeltaBytes: heapDelta(startHeap, endHeap),
          memoryProxy: `hotCacheSize=${cache.size()}/${hotCacheSize}`,
        };
      }

      async function benchmarkIDBWorkerPostMessageWithHotCache(
        records,
        readIDs,
        hotCacheSize,
        readChunkSize,
      ) {
        // Intentionally sample user-agent memory before running benchmark
        // operations. This may include worker memory when supported.
        const startUserAgentMemory = await userAgentMemoryBytes();
        const startMainHeap = heapBytes();
        const cache = new HotCache(hotCacheSize);
        const workerClient = createWorkerClient();
        try {
          await workerClient.clear();
          const startWorkerHeap = await workerClient.getHeapBytes();
          const writeStart = now();
          await workerClient.bulkWrite(records);
          const writeMs = now() - writeStart;

          const coldStart = now();
          const coldValues = await workerReadChunked(
            workerClient,
            readIDs,
            readChunkSize,
          );
          for (let i = 0; i < readIDs.length; i++) {
            if (coldValues[i] !== null) {
              cache.set(readIDs[i], coldValues[i]);
            }
          }
          const coldMs = now() - coldStart;

          const warmStart = now();
          let misses = 0;
          const missIDs = [];
          for (let i = 0; i < readIDs.length; i++) {
            const hit = cache.get(readIDs[i]);
            if (hit === undefined) {
              misses++;
              missIDs.push(readIDs[i]);
            }
          }
          if (missIDs.length > 0) {
            const missValues = await workerReadChunked(
              workerClient,
              missIDs,
              readChunkSize,
            );
            for (let i = 0; i < missIDs.length; i++) {
              if (missValues[i] !== null) {
                cache.set(missIDs[i], missValues[i]);
              }
            }
          }
          const warmMs = now() - warmStart;
          const endMainHeap = heapBytes();
          const endUserAgentMemory = await userAgentMemoryBytes();
          const endWorkerHeap = await workerClient.getHeapBytes();
          const mainHeapDeltaBytes = heapDelta(startMainHeap, endMainHeap);
          const uaMemoryDeltaBytes = heapDelta(
            startUserAgentMemory,
            endUserAgentMemory,
          );
          // If UA memory is available, derive worker delta from
          // combined(main+worker)-main. This can be noisy and may be negative
          // due to GC/allocator movement during sampling; treat negatives as
          // measurement noise instead of guaranteed memory savings.
          const workerHeapDeltaBytes =
            uaMemoryDeltaBytes !== null && mainHeapDeltaBytes !== null
              ? uaMemoryDeltaBytes - mainHeapDeltaBytes
              : heapDelta(startWorkerHeap, endWorkerHeap);

          return {
            name: 'idb-worker-postmessage-bounded-hot-cache',
            writeMs,
            coldMs,
            warmMs,
            warmMisses: misses,
            readChunkSize,
            messageRequestsApprox:
              1 +
              Math.ceil(readIDs.length / Math.max(readChunkSize, 1)) +
              Math.ceil(Math.max(misses, 0) / Math.max(readChunkSize, 1)),
            mainHeapDeltaBytes,
            workerHeapDeltaBytes,
            uaMemoryDeltaBytes,
            heapDeltaBytes:
              uaMemoryDeltaBytes !== null
                ? uaMemoryDeltaBytes
                : combinedHeapDelta(mainHeapDeltaBytes, workerHeapDeltaBytes),
            heapDeltaAccounting:
              uaMemoryDeltaBytes !== null
                ? 'userAgent(main+worker)'
                : workerHeapDeltaBytes !== null
                  ? 'main+worker'
                  : 'main-only-fallback',
            memoryProxy: `hotCacheSize=${cache.size()}/${hotCacheSize}`,
          };
        } finally {
          workerClient.dispose();
        }
      }

      async function workerReadChunked(workerClient, ids, chunkSize) {
        const chunks = [];
        const safeChunkSize = Math.max(chunkSize, 1);
        for (let i = 0; i < ids.length; i += safeChunkSize) {
          const chunk = ids.slice(i, i + safeChunkSize);
          chunks.push(chunk);
        }
        const values = [];
        for (let i = 0; i < chunks.length; i++) {
          const chunkValues = await workerClient.bulkReadByIDs(chunks[i]);
          for (let j = 0; j < chunkValues.length; j++) {
            values.push(chunkValues[j]);
          }
        }
        return values;
      }

      async function benchmarkIDBWorkerPostMessageHighMessageVolume(
        records,
        readIDs,
        hotCacheSize,
      ) {
        return benchmarkIDBWorkerPostMessageWithHotCache(
          records,
          readIDs,
          hotCacheSize,
          1,
        ).then(result => ({
          ...result,
          name: 'idb-worker-postmessage-high-message-volume',
        }));
      }

      function recordsObjectToArray(records) {
        const ids = Object.keys(records);
        const out = new Array(ids.length);
        for (let i = 0; i < ids.length; i++) {
          out[i] = records[ids[i]];
        }
        return out;
      }

      async function benchmarkRelayPipelineInMemory(normalized) {
        const {records, rootID} = normalized;
        const writeStart = now();
        const map = new Map();
        const ids = Object.keys(records);
        for (let i = 0; i < ids.length; i++) {
          map.set(ids[i], records[ids[i]]);
        }
        const normalizeWriteMs = now() - writeStart;

        const readStart = now();
        const denormalized = await denormalizeRelayLikePayload(
          id => Promise.resolve(map.get(id) || null),
          rootID,
        );
        const denormalizeReadMs = now() - readStart;
        return {
          name: 'relay-store-in-memory-pipeline',
          normalizeWriteMs,
          denormalizeReadMs,
          normalizedRecordCount: ids.length,
          denormalizedUsers:
            denormalized != null && denormalized.users != null
              ? denormalized.users.length
              : 0,
        };
      }

      async function benchmarkRelayPipelineIDBMaterialized(db, normalized) {
        const recordsArray = recordsObjectToArray(normalized.records);
        const writeStart = now();
        await bulkWrite(db, recordsArray);
        const normalizeWriteMs = now() - writeStart;

        const materializeStart = now();
        const all = await readAll(db);
        const map = new Map();
        for (let i = 0; i < all.length; i++) {
          map.set(all[i].__id, all[i]);
        }
        const materializeMs = now() - materializeStart;

        const readStart = now();
        const denormalized = await denormalizeRelayLikePayload(
          id => Promise.resolve(map.get(id) || null),
          normalized.rootID,
        );
        const denormalizeReadMs = now() - readStart;
        return {
          name: 'relay-store-idb-plus-materialized-memory-pipeline',
          normalizeWriteMs,
          materializeMs,
          denormalizeReadMs,
          normalizedRecordCount: recordsArray.length,
          denormalizedUsers:
            denormalized != null && denormalized.users != null
              ? denormalized.users.length
              : 0,
        };
      }

      async function benchmarkRelayPipelineIDBDirect(
        db,
        normalized,
        hotCacheSize,
      ) {
        const recordsArray = recordsObjectToArray(normalized.records);
        const cache = new HotCache(hotCacheSize);
        const writeStart = now();
        await bulkWrite(db, recordsArray);
        const normalizeWriteMs = now() - writeStart;

        const readStart = now();
        const denormalized = await denormalizeRelayLikePayload(async id => {
          const cached = cache.get(id);
          if (cached !== undefined) {
            return cached;
          }
          const record = await readByID(db, id);
          if (record !== null) {
            cache.set(id, record);
          }
          return record;
        }, normalized.rootID);
        const denormalizeReadMs = now() - readStart;
        return {
          name: 'relay-store-idb-direct-bounded-hot-cache-pipeline',
          normalizeWriteMs,
          denormalizeReadMs,
          normalizedRecordCount: recordsArray.length,
          denormalizedUsers:
            denormalized != null && denormalized.users != null
              ? denormalized.users.length
              : 0,
        };
      }

      async function benchmarkRelayPipelineWorker(
        normalized,
        hotCacheSize,
        readChunkSize,
      ) {
        const recordsArray = recordsObjectToArray(normalized.records);
        const workerClient = createWorkerClient();
        const cache = new HotCache(hotCacheSize);
        try {
          await workerClient.clear();
          // Intentionally sample user-agent memory before running benchmark
          // operations. This may include worker memory when supported.
          const startUserAgentMemory = await userAgentMemoryBytes();
          const startMainHeap = heapBytes();
          const startWorkerHeap = await workerClient.getHeapBytes();
          const writeStart = now();
          await workerClient.bulkWrite(recordsArray);
          const normalizeWriteMs = now() - writeStart;

          const readStart = now();
          const denormalized = await denormalizeRelayLikePayload(async id => {
            const cached = cache.get(id);
            if (cached !== undefined) {
              return cached;
            }
            const chunked = await workerReadChunked(workerClient, [id], readChunkSize);
            const record = chunked[0] || null;
            if (record !== null) {
              cache.set(id, record);
            }
            return record;
          }, normalized.rootID);
          const denormalizeReadMs = now() - readStart;
          const endMainHeap = heapBytes();
          const endUserAgentMemory = await userAgentMemoryBytes();
          const endWorkerHeap = await workerClient.getHeapBytes();
          const mainHeapDeltaBytes = heapDelta(startMainHeap, endMainHeap);
          const uaMemoryDeltaBytes = heapDelta(
            startUserAgentMemory,
            endUserAgentMemory,
          );
          // If UA memory is available, derive worker delta from
          // combined(main+worker)-main. This can be noisy and may be negative
          // due to GC/allocator movement during sampling; treat negatives as
          // measurement noise instead of guaranteed memory savings.
          const workerHeapDeltaBytes =
            uaMemoryDeltaBytes !== null && mainHeapDeltaBytes !== null
              ? uaMemoryDeltaBytes - mainHeapDeltaBytes
              : heapDelta(startWorkerHeap, endWorkerHeap);
          return {
            name: 'relay-store-idb-worker-postmessage-bounded-hot-cache-pipeline',
            normalizeWriteMs,
            denormalizeReadMs,
            readChunkSize,
            mainHeapDeltaBytes,
            workerHeapDeltaBytes,
            uaMemoryDeltaBytes,
            heapDeltaBytes:
              uaMemoryDeltaBytes !== null
                ? uaMemoryDeltaBytes
                : combinedHeapDelta(mainHeapDeltaBytes, workerHeapDeltaBytes),
            heapDeltaAccounting:
              uaMemoryDeltaBytes !== null
                ? 'userAgent(main+worker)'
                : workerHeapDeltaBytes !== null
                  ? 'main+worker'
                  : 'main-only-fallback',
            normalizedRecordCount: recordsArray.length,
            denormalizedUsers:
              denormalized != null && denormalized.users != null
                ? denormalized.users.length
                : 0,
          };
        } finally {
          workerClient.dispose();
        }
      }

      async function benchmarkRelayPipelineWorkerHighMessage(
        normalized,
        hotCacheSize,
      ) {
        const result = await benchmarkRelayPipelineWorker(
          normalized,
          hotCacheSize,
          1,
        );
        return {
          ...result,
          name: 'relay-store-idb-worker-postmessage-high-message-volume-pipeline',
        };
      }

      function pickReadIDs(recordCount, readSampleCount) {
        const ids = new Array(readSampleCount);
        for (let i = 0; i < readSampleCount; i++) {
          const index = (i * 17) % recordCount;
          ids[i] = makeRecordID(index);
        }
        return ids;
      }

      function formatResult(result) {
        return JSON.stringify(result, null, 2);
      }

      async function run() {
        document.getElementById('output').textContent = '';
        const recordCount = Number(document.getElementById('recordCount').value);
        const readSampleCount = Number(
          document.getElementById('readSampleCount').value,
        );
        const hotCacheSize = Number(document.getElementById('hotCacheSize').value);
        const workerReadChunkSize = Number(
          document.getElementById('workerReadChunkSize').value,
        );
        const relayPayloadUserCount = Number(
          document.getElementById('relayPayloadUserCount').value,
        );
        const relayFriendsPerUser = Number(
          document.getElementById('relayFriendsPerUser').value,
        );

        log(
          `Running with recordCount=${recordCount}, readSampleCount=${readSampleCount}, hotCacheSize=${hotCacheSize}, workerReadChunkSize=${workerReadChunkSize}, relayPayloadUserCount=${relayPayloadUserCount}, relayFriendsPerUser=${relayFriendsPerUser}`,
        );

        const records = new Array(recordCount);
        for (let i = 0; i < recordCount; i++) {
          const id = makeRecordID(i);
          records[i] = makeRecord(id);
        }
        const readIDs = pickReadIDs(recordCount, readSampleCount);
        const db = await openDB();
        try {
          await clearDB(db);
          const inMemory = await benchmarkInMemory(records, readIDs);
          log(formatResult(inMemory));

          await clearDB(db);
          const idbPlusMemory = await benchmarkIDBWithMaterializedMemory(
            db,
            records,
            readIDs,
          );
          log(formatResult(idbPlusMemory));

          await clearDB(db);
          const idbDirect = await benchmarkIDBDirectWithHotCache(
            db,
            records,
            readIDs,
            hotCacheSize,
          );
          log(formatResult(idbDirect));

          const workerIDB = await benchmarkIDBWorkerPostMessageWithHotCache(
            records,
            readIDs,
            hotCacheSize,
            workerReadChunkSize,
          );
          log(formatResult(workerIDB));

          const workerIDBHighMessages =
            await benchmarkIDBWorkerPostMessageHighMessageVolume(
              records,
              readIDs,
              hotCacheSize,
            );
          log(formatResult(workerIDBHighMessages));

          const relayPayload = makeRelayLikePayload(
            relayPayloadUserCount,
            relayFriendsPerUser,
          );
          const relayNormalized = normalizeRelayLikePayload(relayPayload);

          const relayInMemory = await benchmarkRelayPipelineInMemory(
            relayNormalized,
          );
          log(formatResult(relayInMemory));

          await clearDB(db);
          const relayIDBMaterialized =
            await benchmarkRelayPipelineIDBMaterialized(db, relayNormalized);
          log(formatResult(relayIDBMaterialized));

          await clearDB(db);
          const relayIDBDirect = await benchmarkRelayPipelineIDBDirect(
            db,
            relayNormalized,
            hotCacheSize,
          );
          log(formatResult(relayIDBDirect));

          const relayWorker = await benchmarkRelayPipelineWorker(
            relayNormalized,
            hotCacheSize,
            workerReadChunkSize,
          );
          log(formatResult(relayWorker));

          const relayWorkerHighMessage =
            await benchmarkRelayPipelineWorkerHighMessage(
              relayNormalized,
              hotCacheSize,
            );
          log(formatResult(relayWorkerHighMessage));
        } finally {
          db.close();
        }
      }

      document.getElementById('run').addEventListener('click', () => {
        run().catch(error => {
          log(`Benchmark failed: ${String(error)}`);
        });
      });
    </script>
  </body>
